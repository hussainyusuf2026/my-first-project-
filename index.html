here<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenSphere Login</title>
<link rel="stylesheet" href="page1.css">
</head>

<body>

<div class="nav-container">

    <!-- Left Side -->
    <div class="container">
        <button class="logo">GreenSphere</button>

        <h2>Secure Access for Modern Operations</h2>

        <p>
            Help your teams automate workflows and monitor security with
            our intelligent enterprise platform.
        </p>

        <ul>
            <li>✔ Enterprise-grade encryption</li>
            <li>✔ 24/7 Performance Insights</li>
            <li>✔ Seamless Collaboration Tools</li>
        </ul>
    </div>

    <!-- Login -->
    <div class="login-box">

        <h2>Login Here</h2>

        <input type="email" id="email" placeholder="Email Address">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>

</div>

<script src="page1.js"></script>

</body>
  </html>
